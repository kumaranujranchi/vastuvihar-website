# Nginx configuration for Vastu Vihar on AWS Lightsail
# Place at /etc/nginx/sites-available/vastuvihar and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name vastuvihar.org www.vastuvihar.org;

    # Redirect HTTP to HTTPS once SSL is installed
    # return 301 https://$host$request_uri;

    client_max_body_size 25M;

    # Static assets caching
    location /_next/static/ {
        alias /var/www/vastuvihar-website/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public uploads caching
    location /uploads/ {
        alias /var/www/vastuvihar-website/public/uploads/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Reverse proxy to Next.js server
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
